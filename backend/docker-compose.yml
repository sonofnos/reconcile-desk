services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reconcile
      POSTGRES_PASSWORD: reconcile
      POSTGRES_DB: reconcile_desk
    ports:
      - '5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reconcile']
      interval: 5s
      timeout: 5s
      retries: 5
